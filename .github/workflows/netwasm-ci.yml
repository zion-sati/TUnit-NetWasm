name: NetWasm CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/netwasm-ci.yml
      - Directory.Build.props
      - global.json
      - eng/NetWasm.ReleaseVersion.txt
      - eng/netwasm-build-packages.sh
      - eng/netwasm-test.sh
      - eng/project-release-version.py
      - eng/test-project-release-version.py
      - eng/resolve-release.py
      - eng/release-manifest.json
      - eng/release-signers
      - eng/verify-release-packages.py
      - eng/tests/test_resolve_release.py
      - eng/tests/test_verify_release_packages.py
      - packaging/**
      - src/TUnit.Analyzers/PsvmAnalyzer.cs
      - src/TUnit.Core.SourceGenerator/**
      - src/TUnit.Core/Generated*.cs
      - src/TUnit.Core/ITestEntryCatalog.cs
      - src/TUnit.Core/ITestEntrySource.cs
      - src/TUnit.Core/SourceGeneratedTestCatalog.cs
      - src/TUnit.Core/SourceRegistrar.cs
      - src/TUnit.Core/TestEntry.cs
      - src/TUnit.Core/TestEntrySource.cs
      - src/TUnit.Core/TUnit.Core.props
      - src/TUnit.Core/build/TUnit.Core.props
      - tests/TUnit.Analyzers.Tests/PsvmAnalyzerTests.cs
      - tests/TUnit.Core.SourceGenerator.Tests/**
      - tests/TUnit.PublicAPI/**
      - tests/TUnit.TestProject/BasicTests.cs
      - tests/TUnit.UnitTests/Generated*.cs

permissions:
  contents: read

concurrency:
  group: netwasm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and test NetWasm packages
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 eng/test-project-release-version.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            eng/tests/test_resolve_release.py \
            eng/tests/test_verify_release_packages.py
          bash eng/netwasm-test.sh
