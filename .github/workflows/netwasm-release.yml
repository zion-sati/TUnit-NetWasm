name: NetWasm Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netwasm-nuget-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      infrastructure_commit: ${{ steps.release.outputs.infrastructure_commit }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: infrastructure

      - name: Verify manual retry names a published release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'if .draft then error("Release is still a draft") else .tag_name end' |
            grep -Fqx "${RELEASE_TAG}"

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          path: source

      - name: Resolve GitHub Release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git -C source fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          source_commit="$(git -C source rev-parse HEAD)"
          test "$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${source_commit}"
          git -C source merge-base --is-ancestor \
            "${source_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"
          python3 infrastructure/eng/resolve-release.py \
            --manifest infrastructure/eng/release-manifest.json \
            --tag "${RELEASE_TAG}" \
            --tag-prefix "netwasm-v" \
            --source-commit "${source_commit}" \
            --output artifacts/release-manifest.json \
            --github-output "${GITHUB_OUTPUT}"
          infrastructure_commit="$(git -C infrastructure rev-parse HEAD)"
          printf 'infrastructure_commit=%s\n' "${infrastructure_commit}" >> "${GITHUB_OUTPUT}"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json

      - name: Build and test release packages
        shell: bash
        run: |
          NETWASM_TUNIT_TEST_VERSION="${{ steps.release.outputs.version }}" \
            bash source/eng/netwasm-test.sh \
              "$GITHUB_WORKSPACE/artifacts/packages"

      - name: Validate release packages
        shell: bash
        run: |
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/release-manifest.json \
            --packages artifacts/packages \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt artifacts/release-package-receipt.json
          (cd artifacts && sha256sum packages/*.nupkg > SHA256SUMS)

      - name: Retain release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-tunit-${{ steps.release.outputs.version }}
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.infrastructure_commit }}
          path: infrastructure

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netwasm-tunit-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Verify release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/release-manifest.json").read_text())
          expected = {
              "releaseTag": os.environ["RELEASE_TAG"],
              "releaseVersion": os.environ["VERSION"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
          }
          for name, value in expected.items():
              if manifest[name] != value:
                  raise SystemExit(f"Release artifact {name} does not match the GitHub Release.")
          PY

      - name: Revalidate artifacts and NuGet.org identity availability
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/release-manifest.json \
            --packages artifacts/packages \
            --receipt artifacts/publish-package-receipt.json \
            --require-absent-on-nuget

      - name: Request temporary NuGet.org credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          while IFS= read -r package; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json
          done < <(find artifacts/packages -maxdepth 1 -type f -name '*.nupkg' | LC_ALL=C sort)
