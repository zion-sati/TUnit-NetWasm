name: NetWasm Release

on:
  workflow_dispatch:
    inputs:
      coordinated_stage:
        required: true
        type: string
      preparation_sha256:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      infrastructure_commit:
        required: true
        type: string
      coordinator_repository:
        required: true
        type: string
      coordinator_run_id:
        required: true
        type: string
      coordinator_run_attempt:
        required: true
        type: string
      stage_identity:
        required: true
        type: string
      dispatch_attempt_identity:
        required: true
        type: string
      upstream_receipts:
        required: true
        type: string

run-name: NetWasm Release ${{ inputs.coordinated_stage }} ${{ inputs.stage_identity }}

permissions:
  contents: read
  actions: read

concurrency:
  group: netwasm-nuget-release-${{ inputs.stage_identity }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: write
    outputs:
      infrastructure_commit: ${{ steps.receiver.outputs.infrastructure_commit }}
      source_commit: ${{ steps.receiver.outputs.source_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      mode: ${{ steps.train-state.outputs.mode }}
      preview_version: ${{ steps.release.outputs.preview_version }}
      preview_tag: ${{ steps.release.outputs.preview_tag }}
      stable_version: ${{ steps.release.outputs.stable_version }}
      stable_tag: ${{ steps.release.outputs.stable_tag }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.infrastructure_commit }}
          path: infrastructure
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          path: source
      - name: Download coordinated release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          UPSTREAM_RECEIPTS: ${{ inputs.upstream_receipts }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/dispatch"
          mkdir -p "$root/upstream" "$root/upstream-runs"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$root/release.json"

          download_release_asset() {
            local name="$1"
            local output="$2"
            local asset_id
            asset_id="$(jq --arg name "$name" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("release asset is missing or ambiguous") end' \
              "$root/release.json")"
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$output"
          }

          download_release_asset release-preparation.json "$root/release-preparation.json"
          while IFS= read -r coordinate; do
            stage="$(jq -r '.stage' <<< "$coordinate")"
            name="$(jq -r '.fileName' <<< "$coordinate")"
            [[ "$stage" =~ ^[a-z]+(-[a-z]+)*$ ]]
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]
            receipt="$root/upstream/$name"
            download_release_asset "$name" "$receipt"
            repository="$(jq -r '.repository' "$receipt")"
            run_id="$(jq -r '.publication.runId' "$receipt")"
            [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${repository}/actions/runs/${run_id}" \
              > "$root/upstream-runs/$stage.json"
          done < <(jq -c '.[]' <<< "$UPSTREAM_RECEIPTS")
          jq -c '.inputs' "$GITHUB_EVENT_PATH" > "$root/inputs.json"
      - name: Verify coordinated receiver identity
        id: receiver
        shell: bash
        env:
          APPROVED_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 infrastructure/eng/release-receiver.py \
            --inputs artifacts/dispatch/inputs.json \
            --preparation artifacts/dispatch/release-preparation.json \
            --release artifacts/dispatch/release.json \
            --upstream-directory artifacts/dispatch/upstream \
            --upstream-run-directory artifacts/dispatch/upstream-runs \
            --repository "$GITHUB_REPOSITORY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --workflow-identity "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_REF_NAME" \
            --actor-id "$GITHUB_ACTOR_ID" \
            --approved-actor-id "$APPROVED_ACTOR_ID" \
            --tag-commit "$(git -C source rev-parse HEAD)" \
            --output artifacts/dispatch/receiver.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve GitHub Release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_ref }}
        run: |
          git -C source fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          source_commit="$(git -C source rev-parse HEAD)"
          test "$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${source_commit}"
          git -C source merge-base --is-ancestor \
            "${source_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"
          python3 infrastructure/eng/resolve-release.py \
            --manifest infrastructure/eng/release-manifest.json \
            --tag "${RELEASE_TAG}" \
            --tag-prefix "netwasm-v" \
            --source-commit "${source_commit}" \
            --output artifacts/release-manifest.json \
            --train-directory artifacts/train-manifests \
            --github-output "${GITHUB_OUTPUT}"
          infrastructure_commit="$(git -C infrastructure rev-parse HEAD)"
          test "$source_commit" = '${{ steps.receiver.outputs.source_commit }}'
          test "$infrastructure_commit" = '${{ steps.receiver.outputs.infrastructure_commit }}'
          printf 'infrastructure_commit=%s\n' "${infrastructure_commit}" >> "${GITHUB_OUTPUT}"
      - name: Retain coordinated dispatch evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coordinated-inputs-${{ inputs.stage_identity }}
          path: artifacts/dispatch/
          if-no-files-found: error
          retention-days: 90
      - name: Resolve release train state
        id: train-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_MODE: ${{ steps.release.outputs.mode }}
          PREVIEW_TAG: ${{ steps.release.outputs.preview_tag }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
        run: |
          asset_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIEW_TAG}" \
            --jq "[.assets[] | select(.name == \"$ARTIFACT_NAME.json\")] | length")"
          python3 infrastructure/eng/release-train.py state \
            --resolved-mode "$RESOLVED_MODE" \
            --retained-manifest-count "$asset_count" \
            --github-output "$GITHUB_OUTPUT"
      - name: Install .NET SDK
        if: steps.train-state.outputs.mode == 'build'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json
      - name: Build and qualify preview and stable packages
        if: steps.train-state.outputs.mode == 'build'
        shell: bash
        env:
          PREVIEW_VERSION: ${{ steps.release.outputs.preview_version }}
          STABLE_VERSION: ${{ steps.release.outputs.stable_version }}
        run: |
          versions=("preview:$PREVIEW_VERSION" "stable:$STABLE_VERSION")
          for item in "${versions[@]}"; do
            channel="${item%%:*}"
            version="${item#*:}"
            candidate="$GITHUB_WORKSPACE/artifacts/candidates/$channel"
            mkdir -p "$candidate/packages"
            cp "artifacts/train-manifests/$channel-manifest.json" \
              "$candidate/release-manifest.json"
            NETWASM_TUNIT_TEST_VERSION="$version" \
              bash source/eng/netwasm-test.sh "$candidate/packages"
            python3 infrastructure/eng/verify-release-packages.py \
              --manifest "$candidate/release-manifest.json" \
              --packages "$candidate/packages" \
              --source-root source \
              --allowed-signers infrastructure/eng/release-signers \
              --receipt "$candidate/release-package-receipt.json"
          done
      - name: Create immutable preview and stable train
        if: steps.train-state.outputs.mode == 'build'
        shell: bash
        env:
          PREVIEW_VERSION: ${{ steps.release.outputs.preview_version }}
          PREVIEW_TAG: ${{ steps.release.outputs.preview_tag }}
          STABLE_VERSION: ${{ steps.release.outputs.stable_version }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
        run: |
          mkdir -p artifacts/train
          for item in "preview:$PREVIEW_VERSION" "stable:$STABLE_VERSION"; do
            channel="${item%%:*}"
            version="${item#*:}"
            candidate="artifacts/candidates/$channel"
            python3 infrastructure/eng/release-train.py bundle \
              --manifest "$candidate/release-manifest.json" \
              --receipt "$candidate/release-package-receipt.json" \
              --packages "$candidate/packages" \
              --output "artifacts/train/netwasm-tunit-$channel-$version.zip"
          done
          python3 infrastructure/eng/release-train.py create \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ steps.release.outputs.source_commit }}" \
            --producing-tag "$PREVIEW_TAG" \
            --preview-tag "$PREVIEW_TAG" \
            --stable-tag "$STABLE_TAG" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --preview-bundle "artifacts/train/netwasm-tunit-preview-$PREVIEW_VERSION.zip" \
            --stable-bundle "artifacts/train/netwasm-tunit-stable-$STABLE_VERSION.zip" \
            --preparation-sha256 '${{ inputs.preparation_sha256 }}' \
            --infrastructure-commit '${{ inputs.infrastructure_commit }}' \
            --output "artifacts/train/$ARTIFACT_NAME.json"
      - name: Retain verified preview and stable train
        if: steps.train-state.outputs.mode == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: artifacts/train/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Bind retained train manifest to preview GitHub Release
        if: steps.train-state.outputs.mode == 'build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.preview_tag }}
          ASSET_NAME: ${{ steps.release.outputs.artifact_name }}.json
        run: |
          existing="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing"
          asset="artifacts/train/$ASSET_NAME"
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" --dir "$existing" >/dev/null 2>&1; then
            cmp --silent "$asset" "$existing/$ASSET_NAME" || {
              echo "Published release-train manifest differs from this run." >&2
              exit 1
            }
          else
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Resolve retained release train coordinates
        if: steps.train-state.outputs.mode != 'build'
        id: retained-train
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.release.outputs.preview_tag }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
        run: |
          retained="artifacts/retained-train"
          mkdir -p "$retained"
          gh release download "$PREVIEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARTIFACT_NAME.json" \
            --dir "$retained"
          python3 infrastructure/eng/release-train.py identity \
            --train "$retained/$ARTIFACT_NAME.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --producing-tag "$PREVIEW_TAG" \
            --preview-tag "$PREVIEW_TAG" \
            --stable-tag "$STABLE_TAG" \
            --artifact-name "$ARTIFACT_NAME" \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve and verify retained candidate
        if: steps.train-state.outputs.mode != 'build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ steps.train-state.outputs.mode }}
          PREVIEW_TAG: ${{ steps.release.outputs.preview_tag }}
          PREVIEW_VERSION: ${{ steps.release.outputs.preview_version }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          STABLE_VERSION: ${{ steps.release.outputs.stable_version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
        run: |
          retained="artifacts/retained-train"
          downloaded="artifacts/downloaded-train"
          channel=stable
          version="$STABLE_VERSION"
          release_tag="$STABLE_TAG"
          if [[ "$RELEASE_MODE" == "resume" ]]; then
            channel=preview
            version="$PREVIEW_VERSION"
            release_tag="$PREVIEW_TAG"
          fi
          candidate="artifacts/candidates/$channel"
          mkdir -p "$downloaded"
          train="$retained/$ARTIFACT_NAME.json"
          gh run download "${{ steps.retained-train.outputs.producing_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ steps.retained-train.outputs.artifact_name }}" \
            --dir "$downloaded"
          cmp --silent "$train" "$downloaded/$ARTIFACT_NAME.json"
          bundle="$downloaded/netwasm-tunit-$channel-$version.zip"
          python3 infrastructure/eng/release-train.py verify \
            --train "$train" \
            --bundle "$bundle" \
            --channel "$channel" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --release-tag "$release_tag"
          python3 infrastructure/eng/release-train.py extract \
            --bundle "$bundle" \
            --output "$candidate"
          python3 infrastructure/eng/resolve-release.py \
            --manifest infrastructure/eng/release-manifest.json \
            --tag "$release_tag" \
            --tag-prefix "netwasm-v" \
            --source-commit "$SOURCE_COMMIT" \
            --output "$candidate/release-manifest.json"
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest "$candidate/release-manifest.json" \
            --packages "$candidate/packages" \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt "$candidate/release-package-receipt.json"
          cp "$train" "$candidate/release-train.json"
      - name: Retain resolved release artifacts
        if: steps.train-state.outputs.mode != 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-tunit-${{ steps.release.outputs.version }}
          path: artifacts/candidates/${{ steps.train-state.outputs.mode == 'resume' && 'preview' || 'stable' }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: nuget-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.infrastructure_commit }}
          path: infrastructure
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          path: source
      - name: Download coordinated dispatch evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coordinated-inputs-${{ inputs.stage_identity }}
          path: artifacts/dispatch
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json
      - name: Download preview/stable release train
        if: needs.build.outputs.mode == 'build'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts/train
      - name: Download verified retained release artifacts
        if: needs.build.outputs.mode != 'build'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netwasm-tunit-${{ needs.build.outputs.version }}
          path: artifacts/publish
      - name: Select preview candidate from release train
        if: needs.build.outputs.mode == 'build'
        shell: bash
        run: |
          train="artifacts/train/${{ needs.build.outputs.artifact_name }}.json"
          bundle="artifacts/train/netwasm-tunit-preview-${{ needs.build.outputs.preview_version }}.zip"
          python3 infrastructure/eng/release-train.py verify \
            --train "$train" \
            --bundle "$bundle" \
            --channel preview \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ needs.build.outputs.source_commit }}" \
            --release-tag "${{ needs.build.outputs.preview_tag }}"
          python3 infrastructure/eng/release-train.py extract \
            --bundle "$bundle" \
            --output artifacts/publish
      - name: Revalidate release artifacts
        shell: bash
        run: |
          mkdir -p artifacts/publish/timings
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/publish/release-manifest.json \
            --packages artifacts/publish/packages \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt artifacts/publish/publish-package-receipt.json \
            --timing-output artifacts/publish/timings/local-verification.json
      - name: Reconcile NuGet state before requesting credentials
        shell: bash
        run: |
          python3 infrastructure/eng/publish-release-packages.py \
            --manifest artifacts/publish/release-manifest.json \
            --packages artifacts/publish/packages \
            --preflight \
            --timing-output artifacts/publish/timings/feed-preflight.json
      - name: Request temporary NuGet.org credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish and verify dependency waves
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          python3 infrastructure/eng/publish-release-packages.py \
            --manifest artifacts/publish/release-manifest.json \
            --packages artifacts/publish/packages \
            --publish \
            --timing-output artifacts/publish/timings/publication.json
      - name: Record immutable publication receipt
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          UPSTREAM_RECEIPTS: ${{ inputs.upstream_receipts }}
        run: |
          python3 infrastructure/eng/publish-release-packages.py \
            --manifest artifacts/publish/release-manifest.json \
            --packages artifacts/publish/packages \
            --feed-receipt \
            --receipt-output artifacts/publish/feed-receipt.json

          train="artifacts/train/$ARTIFACT_NAME.json"
          if [[ ! -f "$train" ]]; then
            train=artifacts/publish/release-train.json
          fi
          upstream_args=()
          while IFS= read -r coordinate; do
            name="$(jq -r '.fileName' <<< "$coordinate")"
            digest="$(jq -r '.sha256' <<< "$coordinate")"
            upstream_args+=(
              --upstream-receipt "artifacts/dispatch/upstream/$name"
              --upstream-receipt-sha256 "$digest"
            )
          done < <(jq -c '.[]' <<< "$UPSTREAM_RECEIPTS")
          python3 infrastructure/eng/release-train.py publication \
            --preparation artifacts/dispatch/release-preparation.json \
            --stage '${{ inputs.coordinated_stage }}' \
            --train "$train" \
            --feed-receipt artifacts/publish/feed-receipt.json \
            --publication-run-id "$GITHUB_RUN_ID" \
            --publication-run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${upstream_args[@]}" \
            --output artifacts/publish/publication-receipt.json
      - name: Retain immutable publication receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication-receipt-${{ inputs.coordinated_stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain release timing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-tunit-release-timings-${{ needs.build.outputs.version }}
          path: artifacts/publish/timings/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
